# Model field → Google Ads Editor CSV column mapping.
#
# ⚠️  STATUS: THE EDITOR COLUMN NAMES BELOW ARE **UNVERIFIED**.
#
# They are written from knowledge of Google Ads Editor, not copied from a real export of
# the Apex account. Editor imports key on exact English column names, so a wrong header
# means a failed or partial import. Before the first real import somebody must export the
# account from Editor and reconcile every `editor_column` below against that file
# (spec §21 open item 2). Until then the build stamps this warning into MANUAL_STEPS.md
# and the pre-flight report.
#
# Every model field of an exported entity must appear in exactly one of:
#   columns[]          → written to the CSV
#   manual_only[]      → a human step in MANUAL_STEPS.md
#   documentation_only[] → workbook notes that were never account configuration
#
# Anything else that is non-empty raises EXP-001 UNMAPPED SOURCE FIELD and blocks a
# READY build. No workbook field disappears silently.

version: 2

# ---------------------------------------------------------------------------
# VERIFICATION STATE
#
# These column names were written from knowledge of Google Ads Editor, not copied from an
# export of this account. Editor matches on recognisable English headers, and a human can
# remap them during import - but "probably right" is not a standard this system accepts
# for the one contract that decides whether Google understands the files at all.
#
# While `verified: false`, no build can be READY. The best possible outcome is DRAFT:
# quarantined, DO_NOT_IMPORT.txt, `latest` untouched, exit 6.
#
# To flip it: export the account from Google Ads Editor, reconcile every header below
# against that export, then set verified: true and fill verified_against.
# ---------------------------------------------------------------------------
verified: false
verified_against:
  export_date: null      # e.g. 2026-08-20
  editor_version: null   # e.g. "Google Ads Editor 2.9"
  source_sha256: null    # hash of the export the mappings were reconciled against
  reconciled_by: null    # the person who checked it

# ---------------------------------------------------------------------------
# EXPORT INVENTORY
#
# Every record type the compiler produces must appear here with a destination.
#   editor        -> written as an import file
#   manual_steps  -> enumerated in MANUAL_STEPS.md for a person to enter
#
# A record type that is absent blocks the build (EXP-002). This is the entity-level
# counterpart to EXP-001: that rule catches a field nobody mapped, this one catches a
# whole record type nobody noticed. Nine RSAs went missing from a "READY" build before
# this existed.
# ---------------------------------------------------------------------------
inventory:
  campaigns: editor
  ad_groups: editor
  keywords: editor
  account_negatives: editor
  shared_list_rows: editor
  campaign_negatives: editor
  adgroup_negatives: editor
  # RSA and supporting assets go to MANUAL_STEPS.md until the Editor schema is verified.
  # Editor does support importing responsive search ads; what is unverified is the exact
  # column names for THIS account - and ad copy is the worst place to guess.
  ads: manual_steps
  supporting_assets: manual_steps
  # Editor cannot create call assets at all. The resolved number for every ad group
  # is printed in MANUAL_STEPS.md, with the workbook row it came from.
  call_assets: manual_steps

csv:
  encoding: utf-8-sig
  line_terminator: "\r\n"
  quoting: minimal

entities:

  campaigns:
    file: campaigns.csv
    columns:
      - {model_field: name,             editor_column: "Campaign",           required: true}
      - {model_field: status,           editor_column: "Campaign Status",    required: true, transform: paused}
      - {model_field: avg_daily_budget, editor_column: "Budget",             required: true, transform: currency}
      - {model_field: campaign_type,    editor_column: "Campaign Type",      required: true}
      - {model_field: launch_bidding,   editor_column: "Bid Strategy Type",  required: true}
      - {model_field: launch_max_cpc,   editor_column: "Max CPC",            required: false, transform: currency}
      - {model_field: geo,              editor_column: "Location",           required: true}
      - {model_field: languages,        editor_column: "Language",           required: true}
      - {model_field: networks,         editor_column: "Networks",           required: true}
    manual_only:
      - location_option          # Presence vs presence-or-interest is set in the UI
      - primary_conversion       # conversion goals are created in the Google Ads UI
      - secondary_conversions
      - call_phone_number        # call assets are created and verified by hand
      - call_schedule
      - automation_guardrails    # AI Max / auto-apply toggles live in the UI
      - bidding_review_gate
    documentation_only:
      - number
      - monthly_budget           # the daily figure is what Editor imports
      - legacy_avg_cpc
      - why
      - launch_date
      - owner

  ad_groups:
    file: adgroups.csv
    columns:
      - {model_field: campaign, editor_column: "Campaign",        required: true}
      - {model_field: name,     editor_column: "Ad Group",        required: true}
      - {model_field: status,   editor_column: "Ad Group Status", required: true, transform: paused}
    manual_only:
      - negative_lists           # shared-list association, see negative_artifacts below
      - call_asset
    documentation_only:
      - number
      - what_it_owns
      - dominant_intent
      - planned_landing_page     # written on the ad, not the ad group
      - keyword_source
      - negative_lists_raw
      - rsa
      - notes

  keywords:
    file: keywords.csv
    columns:
      - {model_field: campaign,   editor_column: "Campaign",   required: true}
      - {model_field: ad_group,   editor_column: "Ad Group",   required: true}
      - {model_field: text,       editor_column: "Keyword",    required: true}
      - {model_field: match_type, editor_column: "Match Type", required: true, transform: match_type}
      # No Status column. The workbook's "APPROVED" is an approval state, not a Google
      # Ads status, and must never be written into one. Keywords are left at Editor's
      # default (Enabled): the PAUSED campaign is the safety catch, and paused keywords
      # would produce a campaign that looks live and serves nothing.
    documentation_only:
      - status
      - row_type
      - scope
      - list_name
      - copy_paste_value         # derived; the compiler regenerates it
      - copy_paste_expected
      - match_type_raw
      - why
      - added_by
      - added_on

# ---------------------------------------------------------------------------
# NEGATIVE KEYWORDS — FOUR ARTIFACTS, NEVER ONE
#
# Decision A4 says scope is preserved end to end. Export is where that architecture is
# most easily destroyed, because one flat negatives.csv is convenient. It is forbidden.
#
# Do NOT expand a shared list's terms across its campaigns to make importing easier.
# Five copies of one list is exactly the maintenance failure the hierarchy prevents.
#
# If the verified Editor schema cannot reliably import shared-list creation and
# application, shared_negative_lists.csv becomes a HUMAN deployment artifact referenced
# step-by-step in MANUAL_STEPS.md. That is an acceptable outcome. Flattening is not.
# ---------------------------------------------------------------------------

negative_artifacts:
  account_negatives:
    file: account_negatives.csv
    level: ACCOUNT
    columns:
      - {model_field: text,       editor_column: "Keyword",      required: true}
      - {model_field: match_type, editor_column: "Match Type",   required: true, transform: match_type}
      - {model_field: list_name,  editor_column: "Keyword List", required: false}

  shared_negative_lists:
    file: shared_negative_lists.csv
    level: SHARED_LIST
    import_support: UNVERIFIED
    fallback: manual_steps
    columns:
      - {model_field: list_name,  editor_column: "Keyword List", required: true}
      - {model_field: text,       editor_column: "Keyword",      required: true}
      - {model_field: match_type, editor_column: "Match Type",   required: true, transform: match_type}
      - {model_field: applies_to, editor_column: "Campaign",     required: true, transform: join_semicolon}

  campaign_negatives:
    file: campaign_negatives.csv
    level: CAMPAIGN
    columns:
      - {model_field: campaign,   editor_column: "Campaign",   required: true}
      - {model_field: text,       editor_column: "Keyword",    required: true}
      - {model_field: match_type, editor_column: "Match Type", required: true, transform: match_type}

  adgroup_negatives:
    file: adgroup_negatives.csv
    level: AD_GROUP
    columns:
      - {model_field: campaign,   editor_column: "Campaign",   required: true}
      - {model_field: ad_group,   editor_column: "Ad Group",   required: true}
      - {model_field: text,       editor_column: "Keyword",    required: true}
      - {model_field: match_type, editor_column: "Match Type", required: true, transform: match_type}

# Settings Editor cannot encode safely. These become ordered steps in MANUAL_STEPS.md.
manual_only:
  - conversion_actions
  - conversion_values_and_counting
  - attribution_settings
  - shared_negative_list_creation
  - call_asset_creation_and_verification
  - ad_schedule_timezone_nuances
  - audience_attachment
  - portfolio_bid_strategy_membership
  - experiments
