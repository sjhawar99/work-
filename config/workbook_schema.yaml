# Where each logical section lives in the workbook.
#
# DECISION A1 (locked): there is exactly ONE source-of-truth workbook,
# APEX_Google_Ads_Operating_System_v1.1.xlsx, with exactly four sheets:
#
#     01 ACTIONS | 02 BUILD | 03 KEYWORDS | 04 DAILY
#
# The eleven-area structure in the architecture document describes the SOFTWARE's
# capabilities, not Excel tabs. There is no eleven-tab workbook. Do not look for one.
#
# The parser finds sections by HEADER TEXT and columns by HEADER NAME — never by row
# index (spec §4.3).
#
# STATUS: sheet names are final. COLUMN names below are inferred and MUST be reconciled
# against the real workbook in Phase 1 (spec §21 open item 1).

version: 1

sheets:
  actions:  "01 ACTIONS"
  build:    "02 BUILD"
  keywords: "03 KEYWORDS"
  daily:    "04 DAILY"

matching:
  case_sensitive: false
  collapse_whitespace: true
  strip_punctuation: true
  blank_rows_end_section: 2

sections:

  account:
    sheet: "02 BUILD"
    header_contains: "ACCOUNT"
    required_columns: [setting, value]
    optional_columns: [notes]

  campaigns:
    sheet: "02 BUILD"
    header_contains: "CAMPAIGN"
    required_columns: [campaign, daily budget, bid strategy, locations, languages]
    optional_columns: [budget share, ad schedule, search partners, tracking template, notes]

  ad_groups:
    sheet: "02 BUILD"
    header_contains: "AD GROUP"
    required_columns: [campaign, ad group, final url]
    optional_columns: [default max cpc, theme, notes]

  ads:
    sheet: "02 BUILD"
    header_contains: "ADS"
    required_columns: [campaign, ad group, asset type, asset text]
    optional_columns: [position, pinned, path1, path2, notes]

  landing_pages:
    sheet: "02 BUILD"
    header_contains: "LANDING"
    required_columns: [campaign, ad group, final url]
    optional_columns: [status, notes]

  extensions:
    sheet: "02 BUILD"
    header_contains: "EXTENSION"
    required_columns: [level, extension type, text]
    optional_columns: [campaign, ad group, url, description1, description2, notes]

  call_assets:
    sheet: "02 BUILD"
    header_contains: "CALL"
    required_columns: [level, number, schedule]
    optional_columns: [campaign, ad group, country, notes]
    # Optional section. When absent, call assets come from config/rules.yaml only.
    required: false

  conversions:
    sheet: "02 BUILD"
    header_contains: "CONVERSION"
    required_columns: [conversion name, category]
    optional_columns: [value, counting, primary, notes]

  keywords:
    sheet: "03 KEYWORDS"
    header_contains: "KEYWORD"
    required_columns: [campaign, ad group, keyword, match type]
    optional_columns: [max cpc, final url, notes]

  negatives:
    sheet: "03 KEYWORDS"
    header_contains: "NEGATIVE"
    # `scope` carries ACCOUNT / SHARED_LIST / CAMPAIGN / AD_GROUP (Decision A4).
    # It MUST be preserved through the whole pipeline, never flattened.
    required_columns: [scope, negative keyword, match type]
    optional_columns: [campaign, ad group, list name, reason, notes]

  actions:
    sheet: "01 ACTIONS"
    header_contains: "ACTION"
    required_columns: [id, action, owner, severity, status]
    optional_columns: [due, waiver reason, notes]

  daily_log:
    sheet: "04 DAILY"
    header_contains: "DATE"
    required_columns: [date]
    optional_columns: [campaign, impressions, clicks, cost, conversions, notes]
    # Watchdog context only. Never affects the build.
    required: false
