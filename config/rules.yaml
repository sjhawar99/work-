# Apex Google Ads OS — enforcement policy.
#
# LAYERING (see AGENTS.md):
#   WORKBOOK     = approved account values      (₹20k Neuro, Max CPC ₹60, landing page X)
#   CONFIG       = rules governing whether those values are valid   ← this file
#   PYTHON       = logic: parse, normalise, compare, validate, export
#   DECISIONS.md = frozen policy (Modified Broad → Phrase, four-sheet workbook, …)
#
# This file must never acquire an approved account value. If a number belongs to the
# strategy rather than to the rules, it lives in the workbook.

version: 1

# Decision A2: Stage-1 INVARIANTS. Exact. Not waivable. Zero tolerance.
account:
  currency: INR
  monthly_budget: 62000
  monthly_budget_tolerance: 0      # exact. no "close enough".
  daily_budget_rounding_decimals: 2
  days_per_month: 30.4
  expected_campaign_count: 5
  expected_ad_group_count: 9
  primary_domain: apexhospitals.com
  timezone: "Asia/Kolkata"

# The canonical workbook is a Google Sheet. input/workbook.xlsx is an EXPORT ARTIFACT.
# All human edits happen in the Sheet; the export is never edited directly (spec §4.4).
# No credentials, no API — so nothing local can prove the export matches the Sheet.
workbook:
  source: google_sheet_export    # the only legal value (Decision D3)
  canonical_source_is_google_sheet: true
  export_is_read_only_artifact: true
  # WB-001 measures LOCAL FILE AGE ONLY. Advisory. Never report it as "up to date".
  export_staleness_warning_days: 3
  staleness_check_is_advisory_only: true
  print_mtime_in_reports: true

naming:
  # "MLN | Search | Brand | Jaipur"
  campaign_pattern: "^[A-Z]{2,4} \\| Search \\| [A-Za-z0-9 &+-]+ \\| [A-Za-z ]+$"
  # "Brand | Core", "Nephro | Transplant Treatment"
  ad_group_pattern: "^[A-Za-z0-9 &+-]+ \\| [A-Za-z0-9 &+-]+$"

keywords:
  allowed_positive_match_types: [EXACT, PHRASE]   # BROAD positives blocked (A3)
  allowed_negative_match_types: [EXACT, PHRASE, BROAD]  # negative broad is normal and fine
  # NOTE: "Modified Broad" → PHRASE is HARD-CODED in Python (Decision A3, spec §8.4).
  # There is deliberately no config key here, so nobody can ever point it at BROAD.
  max_ad_groups_per_keyword: 1
  min_keywords_per_ad_group: 1
  max_keyword_chars: 80
  verify_copy_paste_column: true   # column G must match text + match type exactly

# Decision A4: hybrid hierarchy, scope preserved end to end. Never flattened.
#
# The workbook's `Scope` column also encodes which campaigns a shared list serves
# ("Shared list → Neuro, Generic, Ortho, Nephro"). The mapping below is the APPROVED
# routing policy; the parser reads the workbook's scope and a validator asserts the two
# agree. Disagreement is a BLOCKER (NEG-008), never a silent preference for one source.
negatives:
  collision_check: true
  allowed_levels: [ACCOUNT, SHARED_LIST, CAMPAIGN, AD_GROUP]
  use_shared_lists: true

  account_lists:
    - ACCOUNT_JUNK
    - OUTSIDE_GEO

  shared_lists:
    ROUTE_BRAND:
      applies_to:
        - "MLN | Search | Neuro | Jaipur"
        - "MLN | Search | Generic | Jaipur"
        - "MLN | Search | Ortho | Jaipur"
        - "MLN | Search | Nephro | Jaipur"
    ROUTE_COMPETITORS:
      applies_to:
        - "MLN | Search | Neuro | Jaipur"
        - "MLN | Search | Generic | Jaipur"
        - "MLN | Search | Ortho | Jaipur"
        - "MLN | Search | Nephro | Jaipur"
    STAGE1_HOLD_COMPARISON:
      applies_to:
        - "MLN | Search | Neuro | Jaipur"
        - "MLN | Search | Generic | Jaipur"
        - "MLN | Search | Ortho | Jaipur"
        - "MLN | Search | Nephro | Jaipur"
    STAGE1_HOLD_ACTION:
      applies_to:
        - "MLN | Search | Neuro | Jaipur"
        - "MLN | Search | Generic | Jaipur"
        - "MLN | Search | Ortho | Jaipur"
        - "MLN | Search | Nephro | Jaipur"
    STAGE1_HOLD_URGENCY:
      applies_to:
        - "MLN | Search | Neuro | Jaipur"
        - "MLN | Search | Generic | Jaipur"
        - "MLN | Search | Ortho | Jaipur"
        - "MLN | Search | Nephro | Jaipur"
    # Brand is deliberately absent from every ROUTE_* and STAGE1_HOLD_* list.

  # The workbook's Scope cell names campaigns by SHORT NAME
  # ("Shared list → Neuro, Generic, Ortho, Nephro"). Resolution is by this explicit map,
  # never by substring matching: `"Neuro" in campaign_name` is not governance, and the
  # day a second Neuro campaign exists it silently becomes wrong. Adding a campaign is
  # then a deliberate config change (STR-008 fails until it is made).
  campaign_scope_aliases:
    Brand:   ["MLN | Search | Brand | Jaipur"]
    Neuro:   ["MLN | Search | Neuro | Jaipur"]
    Generic: ["MLN | Search | Generic | Jaipur"]
    Ortho:   ["MLN | Search | Ortho | Jaipur"]
    Nephro:  ["MLN | Search | Nephro | Jaipur"]

  campaign_sets:
    - GENERIC_EXCLUDE_SPECIALTY
  ad_group_sets:
    - ORTHO_PROVIDER_TO_KNEE

ads:
  headlines:    {min: 3, max: 15, max_chars: 30}
  descriptions: {min: 2, max: 4,  max_chars: 90}
  paths:        {max_chars: 15}
  # Decision A5: what matters is that the entity RESOLVES to a valid call asset —
  # not that a phone number is stuffed into RSA text.
  # A supporting asset must carry an approving status before it reaches the account.
  # The real workbook has one marked VERIFY FACT — a claim nobody has checked.
  approved_asset_statuses: [APPROVED]
  require_resolved_call_asset: true
  require_call_asset_schedule: true
  forbid_emoji: true
  forbid_double_spaces: true
  allowed_all_caps_tokens: [ICU, MRI, CT, IVF, NABH, OPD, ER, RSA, GCLID]

# Decision A5: resolution order is ad group → campaign → account.
#
# EVERY NUMBER LIVES IN THE WORKBOOK. This section holds the ORDER and the placeholder
# vocabulary — nothing that could ever be a real phone number.
#
#   AD_GROUP  → 02 BUILD, CALL ASSET REGISTRY row with Level = AD_GROUP
#   CAMPAIGN  → that registry with Level = CAMPAIGN, else the CAMPAIGN SETTINGS row
#   ACCOUNT   → that registry with Level = ACCOUNT
#
# The registry section is OPTIONAL and absent today, which means "no exceptions": all
# nine ad groups resolve through their campaign row. `overrides.*` and `account_default`
# used to live here and could hold real numbers; that put an approved account value in
# the rules file and gave the system two disagreeing answers to "which number does this
# ad group use" — the validator checked the config override while MANUAL_STEPS.md told
# the operator to type the campaign row. One source now.
call_assets:
  resolution_order: [AD_GROUP, CAMPAIGN, ACCOUNT]
  placeholder_tokens: ["[REQUIRED]", "[REQUIRED BEFORE LAUNCH]", "REQUIRED", "TBD", "—"]
  # A placeholder is fatal only for a READY build (spec §9.6). Phases 0–3 and fixture
  # builds run fine without a real number; a deployable build cannot.
  placeholder_blocks_ready_build: true

# Decision A6: landing-page availability is a BLOCKING pre-flight check.
# UNKNOWN is not PASS. A build with unverified destinations is never READY.
landing_pages:
  # The workbook stores PATHS ("/google/apex-jaipur"). The base URL is joined here.
  base_url: "https://www.apexhospitals.com"
  allowed_domains: [apexhospitals.com, www.apexhospitals.com]
  extra_allowed_domains: []        # explicit whitelist; every entry gets reviewed
  max_url_chars: 200
  require_https: true
  check_http: true
  allowed_status: [200]
  follow_redirects: true
  max_redirect_depth: 5
  final_url_must_be_allowed_domain: true
  googleadsbot_retry: true
  googleadsbot_user_agent: "AdsBot-Google (+http://www.google.com/adsbot.html)"
  record_latency: true
  timeout_seconds: 10
  retries: 2
  unknown_blocks_ready_build: true
  one_landing_page_per_ad_group: true

# Auto-tagging and GCLID survival are load-bearing for measurement.
# UTMs and tracking templates are not, and must never block a valid campaign.
tracking:
  require_auto_tagging: true
  preserve_gclid: true
  require_conversion_goal: true
  require_primary_conversion_selected_for_bidding: true

  utm_params:
    required: false
    recommended:
      - utm_source
      - utm_medium
      - utm_campaign

  tracking_template:
    required: false
    require_lpurl_if_present: true

settings:
  search_partners_allowed: false
  display_expansion_allowed: false
  require_location_targets: true
  require_language_targets: true

# Decision A7: Gaurav exports search terms every Friday, previous 7 days.
# Manual in v1. API ingestion is a later phase and must not block v1.
#
# Stage-1 Watchdog RANKS AND SURFACES. It does not apply statistical cutoffs we have not
# earned. Every threshold below is null on purpose: we have no Apex data yet, and a
# number invented today would become policy by accident. The Watchdog may say
# "this query took 34% of spend"; it may not declare 30% unacceptable because YAML said so.
watchdog:
  input_dir: input/search_terms/
  cadence: weekly-friday
  lookback_days: 7
  owner: Gaurav

  thresholds:
    junk_min_impressions: null
    junk_max_ctr: null
    concentration_spend_share: null
    # Renamed with the finding it grades. `held_demand_min_conversions` graded a finding
    # Stage 1 no longer emits (see findings.py); a threshold naming a finding that does not
    # exist is the decorative-config-key problem this project already fixed once, in A5.
    explicit_keyword_gap_min_conversions: null

  # The taxonomy itself is DERIVED FROM THE WORKBOOK (03 KEYWORDS + campaign names).
  # Only vocabulary that is not an Apex decision lives here: the words Google users type,
  # and which existing negative lists carry competitor and junk vocabulary. Adding an Apex
  # term here would create a second answer to a question 03 KEYWORDS already answers.
  taxonomy:
    brand_specialty_label: Brand      # the campaign-name segment that means "our brand"
    competitor_lists: [ROUTE_COMPETITORS]
    junk_lists: [ACCOUNT_JUNK, OUTSIDE_GEO]
    geo_terms: [jaipur, rajasthan, india, "near me"]
    # English function words. Structural vocabulary, not an Apex decision — but load
    # bearing: "neurologist in jaipur" made `in` a token distinctive to Neuro, and the
    # Watchdog proposed `negative: in (broad)`, which would block almost every query in
    # the account. Excluded from distinctive tokens exactly like geo and modifiers.
    # Quoted, every one of them. YAML 1.1 reads bare `on`, `off`, `yes` and `no` as
    # booleans, so an unquoted list silently becomes `[... True ...]` and the loader
    # rejects it. Quoting is the fix; noticing was the config schema's job and it did.
    stopwords:
      ["in", "at", "of", "for", "the", "a", "an", "and", "or", "to",
       "my", "me", "is", "on", "with", "near", "best"]

    intent_modifiers:
      - treatment
      - surgery
      - cost
      - price
      - fees
      - doctor
      - specialist
      - hospital
      - clinic
      - best
      - top
      - near me
      - book
      - appointment

  concentration_mode: rank_and_review
  learn_thresholds_after_days: 28

  column_aliases:
    # "Search" is the heading Google's Overview "Searches" card uses. Added after a real
    # export was tried against it: without the alias the tool reported "no search-term
    # column", which is true but sends the operator hunting for the wrong thing. With it,
    # the run fails on what is actually missing — that card has no Campaign or Ad group.
    search_term:   ["Search term", "Search terms", "Query", "Search"]
    campaign:      ["Campaign"]
    ad_group:      ["Ad group"]
    keyword:       ["Keyword", "Search keyword", "Matched keyword"]
    match_type:    ["Match type", "Search keyword match type"]
    impressions:   ["Impr.", "Impressions"]
    clicks:        ["Clicks"]
    cost:          ["Cost", "Spend"]
    conversions:   ["Conversions", "Conv."]
    # OPTIONAL. Present when the export is segmented by day; used only to check the
    # range actually covered (WD-003). Absent means the range is unverified, never
    # "assumed correct" — the report says which it is.
    day:           ["Day", "Date"]

drift:
  critical_fields:
    - budget
    - match_type
    - status
    - search_partners
    - display_expansion
    - final_url
    - negatives
    - keywords
  warning_fields:
    - ad_copy
    - max_cpc
    - extensions

# Privacy applies to everything generated, not only to log files.
privacy:
  mask_in_generated_reports: [phone, email]
  raw_search_terms_allowed_in: [input, output_csv]     # both are git-ignored
  raw_search_terms_forbidden_in:
    - logs
    - exceptions
    - console_output
    - dashboard_html
    - findings_json
    - actions_report_txt
    - diagnostic_previews
