[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-ads"
version = "0.1.0"
description = "Apex Google Ads Operating System — build compiler, search-term watchdog, drift checker"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
    "tabulate>=0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Pinned exactly, on purpose. These four tools decide whether a commit is acceptable, so
# CI and a developer's laptop must run the same versions of them. An unpinned `ruff>=0.5`
# meant CI installed a newer ruff than the one used locally, that newer ruff formatted
# Markdown code blocks while the local one skipped them, and every commit from Phase 0
# onward failed `ruff format --check` in CI while reporting clean locally.
#
# A check that disagrees between machines is not a check. Bump these deliberately.
dev = [
    "pytest==9.0.2",
    "ruff==0.15.8",
    "mypy==1.19.1",
    "types-PyYAML==6.0.12.20250915",
    "types-requests==2.32.4.20250913",
]

[project.scripts]
apex = "apex_ads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Python only. The spec's Markdown carries illustrative code blocks that are hand-wrapped
# for a human reader; reformatting them is not an improvement, and newer ruff versions
# will format Markdown unless told otherwise. Stated explicitly so the behaviour does not
# depend on which ruff happens to be installed.
extend-exclude = ["*.md"]
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/apex_ads"]

[[tool.mypy.overrides]]
module = ["pandas.*", "openpyxl.*", "tabulate.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
