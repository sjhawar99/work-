name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Toolchain versions
        # Printed so a divergence between CI and a laptop is visible in the log rather
        # than showing up as a mystery failure. The dev extras pin these exactly.
        run: |
          ruff --version
          mypy --version
          pytest --version

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/apex_ads

      - name: Tests
        run: pytest -q
